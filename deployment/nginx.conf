# Nginx Configuration for CoC AI Agent
#
# This configuration file sets up:
# - HTTP to HTTPS redirect
# - HTTPS with Let's Encrypt SSL
# - WebSocket proxy support
# - Reverse proxy to Node.js backend
#
# Installation:
#   sudo cp deployment/nginx.conf /etc/nginx/sites-available/coc-agent
#   sudo ln -s /etc/nginx/sites-available/coc-agent /etc/nginx/sites-enabled/
#   sudo rm /etc/nginx/sites-enabled/default
#
#   # IMPORTANT: Replace 'coc-agent.example.com' with your actual domain!
#   sudo sed -i 's/coc-agent.example.com/YOUR-DOMAIN-HERE/g' /etc/nginx/sites-available/coc-agent
#
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Then run Certbot to obtain SSL certificate:
#   sudo certbot --nginx -d YOUR-DOMAIN-HERE

# HTTP Server - Redirects to HTTPS
server {
    listen 80;
    listen [::]:80;

    # Domain configured for this deployment
    server_name www.talecraftgame.com;

    # Allow Let's Encrypt verification
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # IMPORTANT: Replace with your actual domain name
    server_name www.talecraftgame.com;

    # SSL Certificates (will be automatically configured by Certbot)
    # ssl_certificate /etc/letsencrypt/live/coc-agent.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/coc-agent.example.com/privkey.pem;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # Logging
    access_log /var/log/nginx/coc-agent-access.log;
    error_log /var/log/nginx/coc-agent-error.log;

    # Proxy Settings (common for all locations)
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket Support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Timeouts for long-running connections (WebSocket and AI processing)
    proxy_connect_timeout 7d;
    proxy_send_timeout 7d;
    proxy_read_timeout 7d;

    # API Routes - Proxy to Node.js backend
    location /api/ {
        proxy_pass http://localhost:3000;

        # Disable buffering for real-time responses
        proxy_buffering off;
    }

    # WebSocket Endpoint
    location /ws {
        proxy_pass http://localhost:3000;

        # Critical for WebSocket
        proxy_buffering off;
    }

    # Static Files and Frontend (React SPA)
    location / {
        proxy_pass http://localhost:3000;

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://localhost:3000;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Don't cache HTML
        location ~* \.html$ {
            proxy_pass http://localhost:3000;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        }
    }

    # File Upload Size Limit
    client_max_body_size 10M;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
